<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hotels</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <main class="mx-auto max-w-5xl px-4 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Hotels</h1>
      <p class="mt-2 text-slate-600">
        Browse hotels and view their rooms.
      </p>
    </header>

    <!-- Loading state -->
    <div
      id="loading"
      class="rounded-xl border border-slate-200 bg-white p-6 text-slate-500 shadow-sm"
    >
      Loading hotels...
    </div>

    <!-- Error state -->
    <div
      id="error"
      class="hidden rounded-xl border border-red-200 bg-red-50 p-6 text-red-700"
    ></div>

    <!-- Hotel list -->
    <div id="hotel-list" class="space-y-4"></div>
  </main>

  <script>
    const hotelList = document.getElementById("hotel-list");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    function hotelAmenities(hotel) {
      const amenities = [];

      if (hotel.hasBreakfast) amenities.push("🍳 Breakfast");
      if (hotel.hasGym) amenities.push("💪 Gym");
      if (hotel.hasPool) amenities.push("🏊 Pool");

      return amenities.length
        ? amenities
            .map(
              amenity => `
                <span class="rounded-full bg-slate-100 px-3 py-1 text-sm text-slate-600">
                  ${amenity}
                </span>
              `
            )
            .join("")
        : `<span class="text-sm text-slate-400">No amenities listed</span>`;
    }

    function roomStatus(room) {
      return room.occupied
        ? `
          <span class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-medium text-red-700">
            Occupied
          </span>
        `
        : `
          <span class="rounded-full bg-green-100 px-2.5 py-1 text-xs font-medium text-green-700">
            Available
          </span>
        `;
    }

    function renderHotel(hotel) {
      const closedBadge = hotel.closed
        ? `
          <span class="rounded-full bg-red-100 px-3 py-1 text-sm font-medium text-red-700">
            Closed
          </span>
        `
        : `
          <span class="rounded-full bg-green-100 px-3 py-1 text-sm font-medium text-green-700">
            Open
          </span>
        `;

      const rooms = hotel.rooms || [];

      return `
        <article class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm transition hover:shadow-md">

          <button
            class="flex w-full items-center justify-between gap-4 p-6 text-left"
            onclick="toggleHotel(${hotel.id})"
            aria-expanded="false"
            id="hotel-button-${hotel.id}"
          >
            <div>
              <div class="flex flex-wrap items-center gap-3">
                <h2 class="text-xl font-semibold">
                  ${escapeHtml(hotel.name)}
                </h2>

                ${closedBadge}
              </div>

              <div class="mt-3 flex flex-wrap gap-2">
                ${hotelAmenities(hotel)}
              </div>
            </div>

            <div class="flex items-center gap-4">
              <div class="hidden text-right text-sm text-slate-500 sm:block">
                <div>${"★".repeat(hotel.stars)}</div>
                <div>
                  ${rooms.length} room${rooms.length !== 1 ? "s" : ""}
                </div>
              </div>

              <span
                id="hotel-arrow-${hotel.id}"
                class="text-xl text-slate-400 transition-transform"
              >
                ▼
              </span>
            </div>
          </button>

          <!-- Expandable rooms -->
          <section
            id="hotel-rooms-${hotel.id}"
            class="hidden border-t border-slate-200 bg-slate-50 p-6"
          >
            <h3 class="mb-4 text-lg font-semibold">
              Rooms
            </h3>

            ${
              rooms.length === 0
                ? `
                  <p class="text-slate-500">
                    No rooms found for this hotel.
                  </p>
                `
                : `
                  <div class="space-y-3">
                    ${rooms
                      .map(
                        room => `
                          <div
                            class="flex flex-col justify-between gap-4 rounded-lg border border-slate-200 bg-white p-4 sm:flex-row sm:items-center"
                          >
                            <div>
                              <div class="flex items-center gap-3">
                                <span class="font-semibold">
                                  Room ${escapeHtml(room.roomNumber)}
                                </span>

                                ${roomStatus(room)}
                              </div>

                              <div class="mt-2 text-sm text-slate-500">
                                Capacity: ${room.capacity}
                                guest${room.capacity !== 1 ? "s" : ""}
                              </div>
                            </div>

                            <div class="text-lg font-semibold text-slate-900">
                              $${room.price}
                              <span class="text-sm font-normal text-slate-500">
                                / night
                              </span>
                            </div>
                          </div>
                        `
                      )
                      .join("")}
                  </div>
                `
            }
          </section>
        </article>
      `;
    }

    function toggleHotel(hotelId) {
      const rooms = document.getElementById(`hotel-rooms-${hotelId}`);
      const button = document.getElementById(`hotel-button-${hotelId}`);
      const arrow = document.getElementById(`hotel-arrow-${hotelId}`);

      const isOpen = !rooms.classList.contains("hidden");

      rooms.classList.toggle("hidden");
      button.setAttribute("aria-expanded", String(!isOpen));
      arrow.classList.toggle("rotate-180", !isOpen);
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    async function loadHotels() {
      try {
        const response = await fetch("http://localhost:8080/hotels");

        if (!response.ok) {
          throw new Error(`Failed to load hotels (${response.status})`);
        }

        const hotels = await response.json();

        loading.classList.add("hidden");

        if (!Array.isArray(hotels) || hotels.length === 0) {
          hotelList.innerHTML = `
            <div class="rounded-xl border border-slate-200 bg-white p-6 text-slate-500 shadow-sm">
              No hotels found.
            </div>
          `;
          return;
        }

        hotelList.innerHTML = hotels.map(renderHotel).join("");

      } catch (err) {
        loading.classList.add("hidden");
        error.textContent = err.message;
        error.classList.remove("hidden");
      }
    }

    loadHotels();
  </script>

</body>
</html>
